name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly Monday 12:00 UTC. Catches dependency drift and new CVEs
    # against an otherwise quiet main.
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build + typecheck + unit tests + security gates ──────────────────────
  quality:
    name: Quality (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.x", "22.x", "24.x"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (core → mcp → cli)
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: pnpm audit (high+ severity gate)
        run: pnpm audit --audit-level=high

      - name: OSV scanner
        # Cross-checks pnpm-lock.yaml against the OSV CVE database; this
        # catches advisories that have not yet propagated to npm's feed.
        uses: google/osv-scanner-action/osv-scanner-action@v2.1.0
        with:
          scan-args: |
            --config=osv-scanner.toml
            --lockfile=pnpm-lock.yaml

  # ── Devnet smoke (main only, read-only, no wallet) ───────────────────────
  # Advisory only: it probes the live devnet backend, so an outage / 5xx there
  # is an infra issue, not a code regression. `continue-on-error` keeps a
  # backend blip from failing the overall CI run; check the job logs for signal.
  smoke-test:
    name: Smoke Test (devnet, --read-only)
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main'
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Read-only smoke against devnet
        run: bash test/smoke.sh
